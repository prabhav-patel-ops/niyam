services:
  niyam:
    build: .
    env_file: .env
    environment:
      NIYAM_ENV: production
      NIYAM_PUBLIC_URL: ${NIYAM_PUBLIC_URL:?Set the public HTTPS origin in .env}
      NIYAM_STATE_DIR: /app/var
      NIYAM_DATA_DIR: /app/data
      NUMBA_CACHE_DIR: /tmp/numba
      PYTHONDONTWRITEBYTECODE: '1'
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1", "--proxy-headers", "--forwarded-allow-ips", "172.30.0.2", "--limit-concurrency", "64", "--timeout-keep-alive", "5"]
    volumes:
      - ./data:/app/data
      - niyam-state:/app/var
    networks:
      service:
        ipv4_address: 172.30.0.3
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 40s
  proxy:
    image: caddy:2.11.7-alpine
    environment:
      NIYAM_DOMAIN: ${NIYAM_DOMAIN:?Set the DNS hostname in .env}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      service:
        ipv4_address: 172.30.0.2
    depends_on: [niyam]
    restart: unless-stopped
networks:
  service:
    ipam:
      config:
        - subnet: 172.30.0.0/24
volumes:
  niyam-state:
  caddy-data:
  caddy-config:
