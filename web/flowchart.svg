<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1180" role="img" aria-labelledby="title desc"><title id="title">Niyam strategy research flow</title><desc id="desc">Prompt and documents become validated rules. Ambiguities return to the user. Daily backtests or training and holdout optimisation produce reports against Nifty 50, with optional paper watches.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#587367" stroke-width="1.5"/></marker></defs><rect width="1200" height="1180" fill="#f6f7ef"/><text x="50" y="62" fill="#132b25" font-family="Georgia,serif" font-size="38">From your idea to evidence.</text><text x="50" y="94" fill="#587367" font-family="Arial,sans-serif" font-size="17">NIYAM · DAILY INDIAN EQUITIES · MANAGED WORKSPACE</text><rect x="430" y="140" width="340" height="104" rx="14" fill="#132b25" stroke="#d4dece"/><text x="450" y="172" fill="#ffffff" font-family="Arial,sans-serif" font-size="19" font-weight="bold">Describe your strategy</text><text x="450" y="199" fill="#dbe9cd" font-family="Arial,sans-serif" font-size="15">Hindi · English · Hinglish</text><text x="450" y="221" fill="#dbe9cd" font-family="Arial,sans-serif" font-size="15">Entry, exit, risk and optimisation</text><rect x="50" y="140" width="300" height="104" rx="14" fill="#ffffff" stroke="#d4dece"/><text x="70" y="172" fill="#132b25" font-family="Arial,sans-serif" font-size="19" font-weight="bold">Attach your rules</text><text x="70" y="199" fill="#587367" font-family="Arial,sans-serif" font-size="15">PDF, DOCX or plain text</text><text x="70" y="221" fill="#587367" font-family="Arial,sans-serif" font-size="15">Extract text; preserve your intent</text><rect x="430" y="300" width="340" height="104" rx="14" fill="#ffffff" stroke="#d4dece"/><text x="450" y="332" fill="#132b25" font-family="Arial,sans-serif" font-size="19" font-weight="bold">Interpret into rules</text><text x="450" y="359" fill="#587367" font-family="Arial,sans-serif" font-size="15">Configured multilingual model</text><text x="450" y="381" fill="#587367" font-family="Arial,sans-serif" font-size="15">Closed JSON schema; no user code</text><rect x="850" y="300" width="300" height="104" rx="14" fill="#ffffff" stroke="#d4dece"/><text x="870" y="332" fill="#132b25" font-family="Arial,sans-serif" font-size="19" font-weight="bold">Optional reference lookup</text><text x="870" y="359" fill="#587367" font-family="Arial,sans-serif" font-size="15">Research unfamiliar named methods</text><text x="870" y="381" fill="#587367" font-family="Arial,sans-serif" font-size="15">Return sources with interpretation</text><rect x="50" y="460" width="300" height="104" rx="14" fill="#ffffff" stroke="#d4dece"/><text x="70" y="492" fill="#132b25" font-family="Arial,sans-serif" font-size="19" font-weight="bold">Resolve an ambiguity</text><text x="70" y="519" fill="#587367" font-family="Arial,sans-serif" font-size="15">At most two focused questions</text><text x="70" y="541" fill="#587367" font-family="Arial,sans-serif" font-size="15">No silent changes to your strategy</text><rect x="430" y="460" width="340" height="104" rx="14" fill="#132b25" stroke="#d4dece"/><text x="450" y="492" fill="#ffffff" font-family="Arial,sans-serif" font-size="19" font-weight="bold">Review the interpretation</text><text x="450" y="519" fill="#dbe9cd" font-family="Arial,sans-serif" font-size="15">Inspect rules, dates, stocks and costs</text><text x="450" y="541" fill="#dbe9cd" font-family="Arial,sans-serif" font-size="15">Edit and confirm before simulation</text><rect x="850" y="460" width="300" height="104" rx="14" fill="#ffffff" stroke="#d4dece"/><text x="870" y="492" fill="#132b25" font-family="Arial,sans-serif" font-size="19" font-weight="bold">Managed market dataset</text><text x="870" y="519" fill="#587367" font-family="Arial,sans-serif" font-size="15">Daily OHLCV + Nifty 50 price index</text><text x="870" y="541" fill="#587367" font-family="Arial,sans-serif" font-size="15">Point-in-time fundamentals</text><rect x="430" y="620" width="340" height="104" rx="14" fill="#ffffff" stroke="#d4dece"/><text x="450" y="652" fill="#132b25" font-family="Arial,sans-serif" font-size="19" font-weight="bold">Validate and align</text><text x="450" y="679" fill="#587367" font-family="Arial,sans-serif" font-size="15">Schema, price basis, dates and gaps</text><text x="450" y="701" fill="#587367" font-family="Arial,sans-serif" font-size="15">Service message if data is unavailable</text><rect x="430" y="780" width="340" height="104" rx="14" fill="#ffffff" stroke="#d4dece"/><text x="450" y="812" fill="#132b25" font-family="Arial,sans-serif" font-size="19" font-weight="bold">Replay daily candles</text><text x="450" y="839" fill="#587367" font-family="Arial,sans-serif" font-size="15">Cached indicators + compiled loop</text><text x="450" y="861" fill="#587367" font-family="Arial,sans-serif" font-size="15">Close decision → next open execution</text><rect x="50" y="780" width="300" height="104" rx="14" fill="#ffffff" stroke="#d4dece"/><text x="70" y="812" fill="#132b25" font-family="Arial,sans-serif" font-size="19" font-weight="bold">Optional optimisation</text><text x="70" y="839" fill="#587367" font-family="Arial,sans-serif" font-size="15">Train → freeze selected parameters</text><text x="70" y="861" fill="#587367" font-family="Arial,sans-serif" font-size="15">Evaluate later holdout separately</text><rect x="850" y="780" width="300" height="104" rx="14" fill="#ffffff" stroke="#d4dece"/><text x="870" y="812" fill="#132b25" font-family="Arial,sans-serif" font-size="19" font-weight="bold">New completed daily bars</text><text x="870" y="839" fill="#587367" font-family="Arial,sans-serif" font-size="15">Managed daily data updates</text><text x="870" y="861" fill="#587367" font-family="Arial,sans-serif" font-size="15">New signals appear in the workspace</text><rect x="430" y="940" width="340" height="104" rx="14" fill="#132b25" stroke="#d4dece"/><text x="450" y="972" fill="#ffffff" font-family="Arial,sans-serif" font-size="19" font-weight="bold">Inspect the evidence</text><text x="450" y="999" fill="#dbe9cd" font-family="Arial,sans-serif" font-size="15">Returns, drawdowns, trades and costs</text><text x="450" y="1021" fill="#dbe9cd" font-family="Arial,sans-serif" font-size="15">Compare with Nifty 50 on same dates</text><rect x="850" y="940" width="300" height="104" rx="14" fill="#ffffff" stroke="#d4dece"/><text x="870" y="972" fill="#132b25" font-family="Arial,sans-serif" font-size="19" font-weight="bold">Optional paper signals</text><text x="870" y="999" fill="#587367" font-family="Arial,sans-serif" font-size="15">Watch rules after each new daily bar</text><text x="870" y="1021" fill="#587367" font-family="Arial,sans-serif" font-size="15">No broker orders or intraday alerts</text><path d="M350 192 H425" fill="none" stroke="#587367" stroke-width="2" marker-end="url(#arrow)"/><path d="M600 244 V294" fill="none" stroke="#587367" stroke-width="2" marker-end="url(#arrow)"/><path d="M770 352 H844" fill="none" stroke="#587367" stroke-width="2" marker-end="url(#arrow)"/><text x="783" y="340" fill="#587367" font-family="Arial,sans-serif" font-size="14">If needed</text><path d="M600 404 V454" fill="none" stroke="#587367" stroke-width="2" marker-end="url(#arrow)"/><text x="616" y="434" fill="#587367" font-family="Arial,sans-serif" font-size="14">Clear rules</text><path d="M430 352 H390 V512 H356" fill="none" stroke="#587367" stroke-width="2" marker-end="url(#arrow)"/><text x="272" y="340" fill="#587367" font-family="Arial,sans-serif" font-size="14">Ambiguous</text><path d="M200 460 V270 H600 V250" fill="none" stroke="#587367" stroke-width="2" marker-end="url(#arrow)"/><text x="210" y="260" fill="#587367" font-family="Arial,sans-serif" font-size="14">Clarify</text><path d="M600 564 V614" fill="none" stroke="#587367" stroke-width="2" marker-end="url(#arrow)"/><path d="M1000 564 V672 H776" fill="none" stroke="#587367" stroke-width="2" marker-end="url(#arrow)"/><text x="800" y="656" fill="#587367" font-family="Arial,sans-serif" font-size="14">Validated data</text><path d="M600 724 V774" fill="none" stroke="#587367" stroke-width="2" marker-end="url(#arrow)"/><path d="M430 672 H200 V774" fill="none" stroke="#587367" stroke-width="2" marker-end="url(#arrow)"/><text x="55" y="659" fill="#587367" font-family="Arial,sans-serif" font-size="14">Search requested</text><path d="M600 884 V934" fill="none" stroke="#587367" stroke-width="2" marker-end="url(#arrow)"/><path d="M200 884 V992 H424" fill="none" stroke="#587367" stroke-width="2" marker-end="url(#arrow)"/><text x="221" y="976" fill="#587367" font-family="Arial,sans-serif" font-size="14">Selected result</text><path d="M770 992 H844" fill="none" stroke="#587367" stroke-width="2" marker-end="url(#arrow)"/><text x="782" y="976" fill="#587367" font-family="Arial,sans-serif" font-size="14">Activate</text><path d="M1000 884 V934" fill="none" stroke="#587367" stroke-width="2" marker-end="url(#arrow)"/><text x="50" y="1110" fill="#132b25" font-family="Arial,sans-serif" font-size="17">The hosted workspace manages accounts, market data and calculations.</text><text x="50" y="1142" fill="#587367" font-family="Arial,sans-serif" font-size="15">Historical simulations do not promise future returns.</text></svg>